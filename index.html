<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OKX MA100 Screener</title>
<meta name="description" content="OKX USDT perpetual swap screener: MA100 demarcation (D1/H4/H1), RSI, and 3M/6M/52W break-of-structure watchlist. Refreshed every 4 hours.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
/* ---------- tokens ---------- */
:root {
  color-scheme: light;
  --bg: #f4f4f2;
  --surface-1: #fcfcfb;
  --surface-2: #f0efec;
  --border: #e2e1dc;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #7a7974;
  --accent: #2a78d6;
  --series-1: #2a78d6;  /* Solana */
  --series-2: #eb6834;  /* Ethereum */
  --series-3: #1baf7a;  /* Other */
  --good: #0ca30c;
  --critical: #d03b3b;
  --good-text: #006300;
  --critical-text: #b42323;
  --bar: #2a78d6;
  --grid: #e8e7e2;
  --shadow: 0 1px 2px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111110;
    --surface-1: #1a1a19;
    --surface-2: #232321;
    --border: #2e2e2b;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --text-muted: #8f8e86;
    --accent: #3987e5;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --good-text: #3fcf3f;
    --critical-text: #ef7b7b;
    --bar: #3987e5;
    --grid: #2a2a27;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111110;
  --surface-1: #1a1a19;
  --surface-2: #232321;
  --border: #2e2e2b;
  --text-primary: #f0efec;
  --text-secondary: #c3c2b7;
  --text-muted: #8f8e86;
  --accent: #3987e5;
  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;
  --good-text: #3fcf3f;
  --critical-text: #ef7b7b;
  --bar: #3987e5;
  --grid: #2a2a27;
  --shadow: none;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text-primary);
  font: 14px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.mono, td.num, .num { font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 20px 16px 48px; }
button, input, select { font: inherit; color: inherit; }

/* ---------- header ---------- */
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
header.top h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
header.top .sub { color: var(--text-secondary); font-size: 13px; margin-top: 4px; }
.top-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn {
  background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
  padding: 7px 12px; cursor: pointer; font-size: 13px; color: var(--text-secondary);
}
.btn:hover { color: var(--text-primary); border-color: var(--text-muted); }
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: var(--good); }
.status-dot.stale { background: #fab219; }
.status-dot.err { background: var(--critical); }

/* ---------- cards ---------- */
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
.card h2 { font-size: 13px; font-weight: 600; margin: 0; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .04em; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 14px 16px 0; flex-wrap: wrap; }
.card-head .hint { color: var(--text-muted); font-size: 12px; }

/* KPI row */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 12px; }
.kpi { padding: 14px 16px; }
.kpi .label { font-size: 12px; color: var(--text-secondary); }
.kpi .value { font-size: 28px; font-weight: 700; letter-spacing: -.02em; margin-top: 2px; }
.kpi .foot { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

/* filters */
.filters { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 12px 16px; margin-bottom: 12px; }
.filters label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-secondary); white-space: nowrap; }
.filters input[type=number] { width: 78px; padding: 5px 7px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-2); }
.filters select { padding: 5px 7px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-2); }
.filters input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; }
.filters .sep { width: 1px; height: 20px; background: var(--border); }
.filters .reset { margin-left: auto; }

/* charts row */
.charts { display: grid; grid-template-columns: minmax(0, 8fr) minmax(0, 4fr); gap: 12px; margin-bottom: 12px; }
@media (max-width: 860px) { .charts { grid-template-columns: 1fr; } }
.chart-body { padding: 10px 16px 14px; position: relative; }
svg text { fill: var(--text-muted); font-size: 11px; font-family: Inter, system-ui, sans-serif; }
svg .lbl { fill: var(--text-secondary); font-size: 12px; }
svg .val { fill: var(--text-primary); font-size: 12px; font-family: "JetBrains Mono", monospace; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-secondary); padding: 0 16px 12px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.tip {
  position: fixed; pointer-events: none; z-index: 20; display: none;
  background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.18); min-width: 160px;
}
.tip b { font-size: 13px; }
.tip .row { display: flex; justify-content: space-between; gap: 14px; color: var(--text-secondary); }
.tip .row span:last-child { color: var(--text-primary); font-family: "JetBrains Mono", monospace; }

/* tabs */
.tabs { display: flex; gap: 4px; padding: 10px 12px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.tab { background: none; border: 0; padding: 8px 12px; cursor: pointer; color: var(--text-secondary); border-bottom: 2px solid transparent; font-weight: 500; }
.tab[aria-selected="true"] { color: var(--text-primary); border-bottom-color: var(--accent); }
.tab .count { color: var(--text-muted); font-weight: 400; margin-left: 4px; }
.tab-tools { margin-left: auto; display: flex; align-items: center; gap: 8px; padding-bottom: 6px; }
.tab-tools input { padding: 6px 9px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-2); width: 170px; }

/* watchlist */
.groups { padding: 6px 16px 16px; }
.group { margin-top: 14px; }
.group-title { display: flex; align-items: baseline; gap: 8px; font-weight: 600; font-size: 15px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.group-title .n { color: var(--text-muted); font-weight: 500; font-size: 13px; }
.group-title .desc { color: var(--text-muted); font-weight: 400; font-size: 12px; margin-left: auto; }
.net { margin-top: 8px; }
.net-title { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin: 6px 0 2px; display: flex; align-items: center; gap: 6px; }
.net-title i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.none { color: var(--text-muted); font-size: 13px; padding: 6px 0; }

/* tables */
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 7px 10px; text-align: left; white-space: nowrap; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); font-weight: 600; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface-1); }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--text-primary); }
th .arrow { opacity: .8; margin-left: 3px; }
td { border-bottom: 1px solid var(--grid); }
tr:hover td { background: var(--surface-2); }
td.num, th.num { text-align: right; }
.groups table { table-layout: fixed; }
.groups th:first-child, .groups td:first-child { width: 34%; }
.groups th { white-space: normal; vertical-align: bottom; }
@media (max-width: 560px) { .groups th, .groups td { padding: 7px 6px; } .groups th:first-child, .groups td:first-child { width: 26%; } }
.coin { font-weight: 600; }
.pos { color: var(--good-text); }
.neg { color: var(--text-secondary); }
.tf { display: inline-flex; gap: 3px; }
.tf span { font-size: 10px; font-weight: 600; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--border); color: var(--text-muted); }
.tf span.on { color: var(--good-text); border-color: color-mix(in srgb, var(--good) 45%, transparent); background: color-mix(in srgb, var(--good) 10%, transparent); }
.tf span.off { color: var(--critical-text); border-color: color-mix(in srgb, var(--critical) 35%, transparent); }
.badge { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: var(--surface-2); color: var(--text-secondary); border: 1px solid var(--border); }
.badge.b52 { color: var(--text-primary); }
.pass { color: var(--good-text); font-weight: 600; }
.fail { color: var(--text-muted); }
.flag { color: var(--text-muted); font-size: 11px; margin-left: 4px; }

/* cross-filter */
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: -2px 0 12px; min-height: 0; }
.chips:empty { display: none; }
.chips .lead { font-size: 12px; color: var(--text-muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; background: color-mix(in srgb, var(--accent) 14%, var(--surface-1)); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
  color: var(--text-primary); border-radius: 999px; padding: 4px 6px 4px 10px; font-size: 12px; cursor: pointer; }
.chip b { font-weight: 600; }
.chip .x { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; color: var(--text-secondary); }
.chip:hover .x { background: var(--surface-2); color: var(--text-primary); }
.chip.clear { background: none; border-color: var(--border); color: var(--text-secondary); padding: 4px 10px; }
.legend button { background: none; border: 1px solid transparent; border-radius: 999px; padding: 2px 8px; cursor: pointer; color: var(--text-secondary); font-size: 12px; }
.legend button:hover { border-color: var(--border); color: var(--text-primary); }
.legend button.on { border-color: var(--accent); color: var(--text-primary); }
.legend button.dim { opacity: .45; }
#barChart .hit, #scatter .quad { cursor: pointer; }
tr.sel td { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.ext { color: var(--text-muted); margin-left: 4px; font-size: 11px; }
/* planner */
.addp { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 1px 7px; font-size: 12px; cursor: pointer; color: var(--text-secondary); margin-left: 8px; vertical-align: 1px; }
.addp:hover { border-color: var(--accent); color: var(--text-primary); }
.addp.in { border-color: color-mix(in srgb, var(--good) 45%, transparent); color: var(--good-text); }
.pl-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.pl-bar input[type=text] { padding: 6px 9px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-2); width: 190px; text-transform: uppercase; }
.pl-bar input[type=text]::placeholder { text-transform: none; }
.pl-bar .hint { color: var(--text-muted); font-size: 12px; margin-left: auto; }
.board { display: grid; grid-template-columns: repeat(5, minmax(220px, 1fr)); gap: 10px; padding: 12px; overflow-x: auto; align-items: start; }
.col { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; min-height: 140px; display: flex; flex-direction: column; }
.col.drop { outline: 2px dashed var(--accent); outline-offset: -2px; }
.col-h { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; font-weight: 600; font-size: 13px; }
.col-h .dot { width: 8px; height: 8px; border-radius: 50%; }
.col-h .n { color: var(--text-muted); font-weight: 500; }
.col-b { padding: 4px 8px 10px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.col-empty { color: var(--text-muted); font-size: 12px; text-align: center; padding: 18px 6px; border: 1px dashed var(--border); border-radius: 8px; }
.pc { background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 7px; cursor: grab; }
.pc.dragging { opacity: .5; }
.pc-top { display: flex; align-items: center; gap: 6px; }
.pc-top .coin { font-size: 14px; }
.pc-top .del { margin-left: auto; background: none; border: 0; color: var(--text-muted); cursor: pointer; font-size: 14px; padding: 0 2px; }
.pc-top .del:hover { color: var(--critical-text); }
.pc-meta { font-size: 11px; color: var(--text-muted); line-height: 1.5; }
.pc-meta b { color: var(--text-secondary); font-weight: 600; font-family: "JetBrains Mono", monospace; }
.pc-lv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
.pc-lv label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; display: flex; flex-direction: column; gap: 2px; }
.pc-lv input { width: 100%; padding: 4px 6px; border: 1px solid var(--border); border-radius: 5px; background: var(--surface-2); font-family: "JetBrains Mono", monospace; font-size: 12px; }
.pc-rr { font-size: 11px; color: var(--text-secondary); }
.pc-rr b { font-family: "JetBrains Mono", monospace; color: var(--text-primary); }
.pc textarea { width: 100%; min-height: 58px; resize: vertical; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-2); font: 12px/1.45 Inter, system-ui, sans-serif; color: var(--text-primary); }
.pc-foot { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-muted); }
.pc-foot select { margin-left: auto; padding: 3px 5px; border: 1px solid var(--border); border-radius: 5px; background: var(--surface-2); font-size: 11px; }
@media (max-width: 560px) { .board { grid-template-columns: repeat(5, 82vw); } .pl-bar .hint { margin-left: 0; } }
footer.note { color: var(--text-muted); font-size: 12px; margin-top: 18px; line-height: 1.6; }
.banner { padding: 12px 16px; margin-bottom: 12px; border-left: 3px solid var(--critical); }
.loading { padding: 40px; text-align: center; color: var(--text-muted); }
@media (max-width: 560px) {
  .kpi .value { font-size: 24px; }
  .tab-tools { margin-left: 0; width: 100%; }
  .tab-tools input { width: 100%; }
  .filters .reset { margin-left: 0; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>OKX MA100 Demarcation Screener</h1>
      <div class="sub" id="subline"><span class="status-dot" id="dot"></span><span id="refreshed">Loading data…</span></div>
    </div>
    <div class="top-actions">
      <a class="btn" id="csvLink" href="#" download>Download CSV</a>
      <button class="btn" id="reload" type="button">Refresh</button>
      <button class="btn" id="theme" type="button" aria-label="Toggle light/dark theme">Theme</button>
    </div>
  </header>

  <div id="banner"></div>

  <section class="kpis" id="kpis" aria-label="Summary"></section>

  <section class="card filters" aria-label="Filters">
    <label>Min RSI D1 <input type="number" id="fRsi" step="1" min="0" max="100"></label>
    <label>Min swing-high RSI <input type="number" id="fSwing" step="1" min="0" max="100"></label>
    <label>Min avg vol (USDT) <select id="fLiq">
      <option value="0">Any</option><option value="100000">$100K</option><option value="500000">$500K</option>
      <option value="1000000">$1M</option><option value="5000000">$5M</option><option value="20000000">$20M</option>
    </select></label>
    <label>Near high within <input type="number" id="fNear" step="1" min="0" max="100">%</label>
    <span class="sep" aria-hidden="true"></span>
    <span id="tfToggles" style="display:inline-flex;gap:14px;flex-wrap:wrap"></span>
    <button class="btn reset" id="fReset" type="button">Reset to screener defaults</button>
  </section>

  <div class="chips" id="chips" aria-live="polite"></div>

  <section class="charts">
    <div class="card">
      <div class="card-head"><h2>Momentum quadrant</h2><span class="hint">click a quadrant or network to filter · click a bubble for TradingView</span></div>
      <div class="chart-body" id="scatter"></div>
      <div class="legend" id="scatterLegend"></div>
    </div>
    <div class="card">
      <div class="card-head"><h2>Watchlist by tier</h2><span class="hint">tokens passing filters</span></div>
      <div class="chart-body" id="barChart"></div>
    </div>
  </section>

  <section class="card">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-tab="watch">Watchlist<span class="count" id="cWatch"></span></button>
      <button class="tab" role="tab" aria-selected="false" data-tab="all">All instruments<span class="count" id="cAll"></span></button>
      <button class="tab" role="tab" aria-selected="false" data-tab="plan">Planner<span class="count" id="cPlan"></span></button>
      <div class="tab-tools"><input type="search" id="search" placeholder="Search coin…" aria-label="Search coin"></div>
    </div>
    <div id="panelWatch" class="groups"><div class="loading">Loading…</div></div>
    <div id="panelAll" class="tbl-wrap" hidden></div>
    <div id="panelPlan" hidden>
      <div class="pl-bar">
        <input type="text" id="plAdd" list="plTokens" placeholder="Add token, e.g. SOL" aria-label="Token to add to planner">
        <datalist id="plTokens"></datalist>
        <button class="btn" id="plAddBtn" type="button">+ Add card</button>
        <button class="btn" id="plExport" type="button">Export</button>
        <button class="btn" id="plImportBtn" type="button">Import</button>
        <input type="file" id="plImport" accept="application/json" hidden>
        <span class="hint">Drag cards between columns · notes save automatically in this browser</span>
      </div>
      <div class="board" id="board"></div>
    </div>
  </section>

  <footer class="note" id="notes"></footer>
</div>
<div class="tip" id="tip" role="tooltip"></div>

<script>
/* =====================================================================
   CONFIG — where the CSVs live.
   On GitHub Pages the page sits next to /data, so the relative path works.
   Opened anywhere else (e.g. a local file), it falls back to the raw repo URL.
   ===================================================================== */
const REPO = "greatcyan/NoMoreOverwhelm";
const BRANCH = "main";
const LATEST_FILE = "okx_demarcation_latest.csv";
const LOCAL_BASE = "data/";
const RAW_BASE = `https://raw.githubusercontent.com/${REPO}/${BRANCH}/data/`;

/* MA100 demarcation timeframes. GATE_TFS = what the screener / Discord digest filters on (ticked by default);
   the others are optional extra filters on this page only (unticked by default, snapshot as of each run). */
const ALL_TFS = ["D1", "H4", "H1", "M30", "M15", "M5"];
const GATE_TFS = ["D1"];
const TF_LABEL = { D1: "1D", H4: "4H", H1: "1H", M30: "30m", M15: "15m", M5: "5m" };

/* Screener defaults — mirror the Python script's CLI defaults */
const DEFAULTS = { rsi: 50, swing: 70, liq: 500000, near: 25 };
const STALE_HOURS = 6; // schedule is every 4h; warn if data is older than this

/* ---------- network buckets (mirrors NETWORK_MAP / simplify_network in the script) ---------- */
const NETWORK_MAP = {
  BTC:"Bitcoin",ETH:"Ethereum",SOL:"Solana",AVAX:"Avalanche",NEAR:"NEAR",SUI:"Sui",WAL:"Sui",APT:"Aptos",TIA:"Celestia",
  SEI:"Sei",INJ:"Injective",KSM:"Kusama",ALGO:"Algorand",ZIL:"Zilliqa",QTUM:"Qtum",NEO:"Neo",GAS:"Neo",
  ARB:"Arbitrum",OP:"Optimism",STX:"Stacks (Bitcoin L2)",ZK:"zkSync (Ethereum L2)",ZRO:"Ethereum (LayerZero)",
  BERA:"Berachain",TAO:"Bittensor",OKB:"X Layer (OKX, Ethereum L2)",
  RENDER:"Solana",PYTH:"Solana",JUP:"Solana",RAY:"Solana",W:"Solana",MEW:"Solana",PUMP:"Solana",GRASS:"Solana",
  MUBARAK:"Solana",HUMA:"Solana",WLD:"Optimism",MAGIC:"Arbitrum",BIGTIME:"Ethereum (appchain)",
  PLUME:"Ethereum (Plume L2)",MERL:"Bitcoin (Merlin L2)",AR:"Arweave",AAVE:"Ethereum",COMP:"Ethereum",SNX:"Ethereum",
  AXS:"Ethereum/Ronin",MANA:"Ethereum",ENJ:"Ethereum",BAT:"Ethereum",ZRX:"Ethereum",ARKM:"Ethereum",API3:"Ethereum",
  IMX:"Ethereum (Immutable X)",GALA:"Ethereum/GalaChain",ONDO:"Ethereum",AGLD:"Ethereum",YGG:"Ethereum/Polygon",
  NMR:"Ethereum",BAND:"Ethereum",INIT:"Initia (Cosmos)"
};
const STOCK_TICKERS = new Set(["NVDA","META","MSTR","AMD","CRWD","HPE","CSCO","MRVL","ISRG","A","SMH","QQQ","ASML","TQQQ",
  "AMAT","TWLO","PROS","CIEN","EWZ","GME","OPENAI","ALAB","GEV","SPCX"]);
const ETH_L2 = new Set(["ARB","OP","WLD","MAGIC","ZK","OKB"]);
const NET_ORDER = ["Solana","Ethereum","Other Networks"];
const NET_COLOR = { "Solana":"var(--series-1)", "Ethereum":"var(--series-2)", "Other Networks":"var(--series-3)" };
function bucket(base) {
  const n = STOCK_TICKERS.has(base) ? "Tokenized Equities/ETFs" : (NETWORK_MAP[base] || "Other/Unclassified");
  if (n.includes("Solana")) return "Solana";
  if (n.includes("Ethereum") || ETH_L2.has(base)) return "Ethereum";
  return "Other Networks";
}

/* ---------- digest groups (mirrors DIGEST_GROUPS) ---------- */
const GROUPS = [
  { short:"52W", key:"52WH", label:"Near 52WH BOS", emoji:"🚀", pct:"Pct_From_52W_High", desc:"broke the 52-week high" },
  { short:"6M", key:"6MH",  label:"Near 6MH BOS",  emoji:"🔥", pct:"Pct_From_6M_High",  desc:"broke the 6-month high" },
  { short:"3M", key:"3MH",  label:"Near 3MH BOS",  emoji:"⚡", pct:"Pct_From_3M_High",  desc:"broke the 3-month high" },
  { short:"52W", key:"APPROACH_52W", label:"Approaching 52W High", emoji:"🟣", pct:"Pct_From_52W_High", desc:"closing in on the 52W high" },
  { short:"6M", key:"APPROACH_6M",  label:"Approaching 6M High",  emoji:"🟡", pct:"Pct_From_6M_High",  desc:"closing in on the 6M high" },
  { short:"3M", key:"APPROACH_3M",  label:"Approaching 3M High",  emoji:"🟠", pct:"Pct_From_3M_High",  desc:"closing in on the 3M high" },
];

/* ---------- state ---------- */
const S = { rows: [], cols: {}, tfs: [], tab: "watch", sort: { key: "vol24", dir: -1 }, search: "", f: {},
  sel: { tier: null, net: null, quad: null } };   // cross-filter selections

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const num = v => (v === "" || v == null || v === "nan" || v === "NaN") ? null : (isNaN(+v) ? null : +v);
const bool = v => v === true || v === "True" || v === "true" || v === "1";
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmtPct = v => v == null ? "–" : (v > 0 ? "+" : "") + v.toFixed(1) + "%";
const fmtRsi = v => v == null ? "–" : v.toFixed(1);
function fmtVol(v) {
  if (v == null) return "–";
  if (v >= 1e9) return "$" + (v / 1e9).toFixed(1) + "B";
  if (v >= 1e6) return "$" + (v / 1e6).toFixed(1) + "M";
  if (v >= 1e3) return "$" + (v / 1e3).toFixed(1) + "K";
  return "$" + v.toFixed(0);
}
function fmtPrice(v) {
  if (v == null) return "–";
  if (v >= 1000) return v.toLocaleString(undefined, { maximumFractionDigits: 1 });
  if (v >= 1) return v.toFixed(3);
  return v.toPrecision(4);
}
const tvUrl = base => `https://www.tradingview.com/chart/?symbol=OKX:${encodeURIComponent(base)}USDT.P&interval=D`;   // opens on the daily chart
function storage(k, v) {
  try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; }
}

/* ---------- theme ---------- */
(function initTheme() {
  const saved = storage("scr-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);
  $("theme").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme")
      || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    storage("scr-theme", next);
    render();
  });
})();

/* ---------- data loading ---------- */
function parseCsv(text) {
  return Papa.parse(text, { header: true, skipEmptyLines: true }).data;
}
async function fetchCsv(name) {
  const bust = "?t=" + Date.now();
  const onPages = location.protocol.startsWith("http");
  const urls = onPages ? [LOCAL_BASE + name + bust, RAW_BASE + name + bust] : [RAW_BASE + name + bust];
  let lastErr;
  for (const u of urls) {
    try {
      const r = await fetch(u, { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status + " for " + u.split("?")[0]);
      const txt = await r.text();
      if (!txt.trim()) throw new Error("Empty file: " + u.split("?")[0]);
      $("csvLink").href = u.split("?")[0];
      return parseCsv(txt);
    } catch (e) { lastErr = e; }
  }
  throw lastErr;
}

function detectColumns(sample) {
  const keys = Object.keys(sample);
  const swing = keys.map(k => k.match(/^RSI_Highest_(\d+)D$/)).filter(Boolean)
    .sort((a, b) => (a[1] === "22" ? -1 : b[1] === "22" ? 1 : +b[1] - +a[1]))[0];
  const avg = keys.map(k => k.match(/^AvgVol_(\d+)D_USDT$/)).filter(Boolean)[0];
  return {
    swing: swing ? swing[0] : null, swingDays: swing ? +swing[1] : null,
    avg: avg ? avg[0] : null, avgDays: avg ? +avg[1] : null,
    tfs: ALL_TFS.filter(tf => keys.includes("Above_" + tf)),
  };
}

function normalise(raw, cols) {
  return raw.map(r => ({
    inst: r.InstId, base: r.BaseCcy || (r.InstId || "").split("-")[0],
    net: bucket(r.BaseCcy || ""),
    close: num(r.Close_D1),
    above: Object.fromEntries(cols.tfs.map(tf => [tf, r["Above_" + tf] === "" ? null : bool(r["Above_" + tf])])),
    aots: r.MA_Alignment_D1 || "",
    bos: r.BOS || "NONE",
    pct52: num(r.Pct_From_52W_High), pct6: num(r.Pct_From_6M_High), pct3: num(r.Pct_From_3M_High), pctAth: num(r.Pct_From_ATH),
    partial52: bool(r.Partial_52W_History),
    rsi: num(r.RSI_D1),
    swing: cols.swing ? num(r[cols.swing]) : null,
    avgVol: cols.avg ? num(r[cols.avg]) : null,
    vol24: num(r.Vol24h_USDT),
    passCsv: bool(r.Above_All_TF),
    refreshed: r.LastRefreshed || "",
    raw: r,
  }));
}

/* ---------- screening (mirrors run_screener's mask, but with live-editable thresholds) ---------- */
function screen(r) {
  const f = S.f;
  for (const tf of S.tfs) if (f["tf_" + tf] && !r.above[tf]) return false;
  if ((r.avgVol ?? 0) < f.liq) return false;
  if (!(r.rsi != null && r.rsi > f.rsi)) return false;
  if (!(r.swing != null && r.swing > f.swing)) return false;
  if (f.requireNear && !nearAny(r)) return false;
  return true;
}
const isNear = p => p != null && p >= -S.f.near;
const nearAny = r => isNear(r.pct3) || isNear(r.pct6) || isNear(r.pct52) || isNear(r.pctAth);
function tierOf(r) {
  if (r.bos && r.bos !== "NONE") return r.bos;
  if (isNear(r.pct52)) return "APPROACH_52W";
  if (isNear(r.pct6)) return "APPROACH_6M";
  return "APPROACH_3M";
}
const pctFor = (r, col) => ({ Pct_From_52W_High: r.pct52, Pct_From_6M_High: r.pct6, Pct_From_3M_High: r.pct3 }[col]);

/* ---------- filters UI ---------- */
function loadFilters() {
  let saved = {};
  try { saved = JSON.parse(storage("scr-filters") || "{}"); } catch (e) {}
  if (saved.v !== 2) saved = {};   // filter defaults changed in v2 (only 1D is a screener filter)
  S.f = { rsi: DEFAULTS.rsi, swing: DEFAULTS.swing, liq: DEFAULTS.liq, near: DEFAULTS.near, requireNear: true, ...saved };
  for (const tf of S.tfs) if (S.f["tf_" + tf] === undefined) S.f["tf_" + tf] = GATE_TFS.includes(tf);
}
function syncFilterInputs() {
  $("fRsi").value = S.f.rsi; $("fSwing").value = S.f.swing; $("fNear").value = S.f.near;
  $("fLiq").value = String(S.f.liq);
  if (![...$("fLiq").options].some(o => +o.value === S.f.liq)) $("fLiq").value = "500000";
  $("tfToggles").innerHTML = `<span style="font-size:13px;color:var(--text-secondary)">Above MA100:</span>` + S.tfs.map(tf =>
    `<label title="${GATE_TFS.includes(tf) ? "Screener filter" : "Optional — snapshot as of the last run"}"><input type="checkbox" data-tf="${tf}" ${S.f["tf_" + tf] ? "checked" : ""}> ${TF_LABEL[tf]}</label>`
  ).join("") + `<span class="sep" aria-hidden="true"></span>` + `<label><input type="checkbox" id="fReqNear" ${S.f.requireNear ? "checked" : ""}> Near a high</label>`;
}
function bindFilters() {
  const upd = () => {
    S.f.rsi = +$("fRsi").value || 0; S.f.swing = +$("fSwing").value || 0;
    S.f.near = +$("fNear").value || 0; S.f.liq = +$("fLiq").value || 0;
    $("tfToggles").querySelectorAll("input[data-tf]").forEach(cb => S.f["tf_" + cb.dataset.tf] = cb.checked);
    const rn = $("fReqNear"); if (rn) S.f.requireNear = rn.checked;
    storage("scr-filters", JSON.stringify({ ...S.f, v: 2 }));
    render();
  };
  ["fRsi", "fSwing", "fNear", "fLiq"].forEach(id => $(id).addEventListener("input", upd));
  $("tfToggles").addEventListener("change", upd);
  $("fReset").addEventListener("click", () => {
    S.f = { ...DEFAULTS, requireNear: true }; S.tfs.forEach(tf => S.f["tf_" + tf] = GATE_TFS.includes(tf));
    storage("scr-filters", JSON.stringify({ ...S.f, v: 2 })); syncFilterInputs(); render();
  });
}

/* ---------- cross-filter ---------- */
const QUAD_RSI = 80;   // horizontal split of the quadrant chart
const QUADS = {
  TR: "Breakout + hot", TL: "Hot, below high", BR: "Breakout, cooling", BL: "Setting up",
};
function quadOf(r) {
  if (r.pct52 == null || r.swing == null) return null;
  return (r.swing >= QUAD_RSI ? "T" : "B") + (r.pct52 >= 0 ? "R" : "L");
}
// does a row match the active selections? `except` skips one dimension (for that chart's own view)
function matchSel(r, except) {
  const s = S.sel;
  if (s.tier && except !== "tier" && tierOf(r) !== s.tier) return false;
  if (s.net && except !== "net" && r.net !== s.net) return false;
  if (s.quad && except !== "quad" && quadOf(r) !== s.quad) return false;
  return true;
}
function toggleSel(dim, val) { S.sel[dim] = S.sel[dim] === val ? null : val; render(); }
function clearSel() { S.sel = { tier: null, net: null, quad: null }; render(); }
function renderChips() {
  const s = S.sel, chips = [];
  if (s.tier) { const g = GROUPS.find(x => x.key === s.tier); chips.push(["tier", `${g.emoji} <b>${esc(g.label)}</b>`]); }
  if (s.net) chips.push(["net", `Network: <b>${esc(s.net)}</b>`]);
  if (s.quad) chips.push(["quad", `Quadrant: <b>${esc(QUADS[s.quad])}</b>`]);
  $("chips").innerHTML = chips.length ? `<span class="lead">Filtered by</span>` +
    chips.map(([d, h]) => `<button class="chip" type="button" data-dim="${d}" title="Remove filter">${h}<span class="x" aria-hidden="true">✕</span></button>`).join("") +
    (chips.length > 1 ? `<button class="chip clear" type="button" data-dim="all">Clear all</button>` : "") : "";
  $("chips").querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
    if (c.dataset.dim === "all") clearSel(); else { S.sel[c.dataset.dim] = null; render(); }
  }));
}

/* ---------- render: KPIs ---------- */
function renderKpis(pass) {
  const by = k => pass.filter(r => tierOf(r) === k).length;
  const bos = pass.filter(r => r.bos !== "NONE").length;
  const gate = S.tfs.filter(tf => S.f["tf_" + tf]);
  const fullStack = gate.length ? S.rows.filter(r => gate.every(tf => r.above[tf])).length : 0;
  const tiles = [
    { label: "Watchlist", value: pass.length, foot: `of ${S.rows.length} scanned` },
    { label: "Broke a high (BOS)", value: bos, foot: `${by("52WH")} × 52W · ${by("6MH")} × 6M · ${by("3MH")} × 3M` },
    { label: "Approaching a high", value: pass.length - bos, foot: `within ${S.f.near}% of a level` },
    { label: `Above MA100 on ${gate.map(t => TF_LABEL[t]).join("+") || "1D"}`, value: fullStack, foot: "all instruments, before RSI filters" },
    { label: "Last refreshed", value: S.lastTime ? S.lastTime.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }) : "–",
      foot: S.lastTime ? S.lastTime.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + " · " + S.ageText : "", small: true },
  ];
  $("kpis").innerHTML = tiles.map(t =>
    `<div class="card kpi"><div class="label">${esc(t.label)}</div><div class="value mono"${t.small ? ' style="font-size:22px;padding-top:4px"' : ""}>${esc(t.value)}</div><div class="foot">${esc(t.foot)}</div></div>`
  ).join("");
}

/* ---------- render: bar chart (tiers) — click a bar to filter everything else ---------- */
function renderBars(pass) {
  const base = pass.filter(r => matchSel(r, "tier"));   // respects other selections, not its own
  const data = GROUPS.map(g => ({ g, n: base.filter(r => tierOf(r) === g.key).length }));
  const max = Math.max(1, ...data.map(d => d.n));
  const W = Math.max(260, $("barChart").clientWidth - 32), rowH = 44, valW = 30;
  const H = data.length * rowH + 4, plotW = Math.max(40, W - valW);
  let svg = `<svg width="100%" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tokens per watchlist tier. Click a bar to filter.">`;
  data.forEach((d, i) => {
    const y = i * rowH + 4, w = d.n ? Math.max(4, (d.n / max) * plotW) : 0;
    const on = S.sel.tier === d.g.key, dim = S.sel.tier && !on;
    svg += `<g opacity="${dim ? 0.35 : 1}">`;
    svg += `<text class="lbl" x="0" y="${y + 12}" style="${on ? "font-weight:700;fill:var(--text-primary)" : ""}">${d.g.emoji} ${esc(d.g.label)}</text>`;
    svg += `<rect x="0" y="${y + 18}" width="${plotW}" height="14" rx="4" fill="var(--surface-2)"/>`;
    if (w) svg += `<rect x="0" y="${y + 18}" width="${w}" height="14" rx="4" fill="var(--bar)"/>`;
    svg += `<text class="val" x="${W - 2}" y="${y + 30}" text-anchor="end">${d.n}</text></g>`;
    svg += `<rect class="hit" data-i="${i}" x="0" y="${y - 3}" width="${W}" height="${rowH}" fill="transparent" role="button" tabindex="0" aria-pressed="${on}" aria-label="${esc(d.g.label)}: ${d.n} tokens"/>`;
  });
  svg += "</svg>";
  $("barChart").innerHTML = svg;
  $("barChart").querySelectorAll(".hit").forEach(el => {
    const d = data[+el.dataset.i];
    el.addEventListener("mousemove", e => {
      const names = base.filter(r => tierOf(r) === d.g.key).slice(0, 8).map(r => r.base).join(", ");
      showTip(e, `<b>${d.g.emoji} ${esc(d.g.label)}</b><div class="row"><span>Tokens</span><span>${d.n}</span></div>` +
        (names ? `<div style="margin-top:4px;color:var(--text-muted);max-width:240px;white-space:normal">${esc(names)}${d.n > 8 ? "…" : ""}</div>` : "") +
        `<div style="margin-top:4px;color:var(--text-muted)">${S.sel.tier === d.g.key ? "Click to clear filter" : "Click to filter"}</div>`);
    });
    el.addEventListener("mouseleave", hideTip);
    const act = () => { hideTip(); toggleSel("tier", d.g.key); };
    el.addEventListener("click", act);
    el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(); } });
  });
}

/* ---------- render: quadrant bubble chart ----------
   x = % from 52-week high (right of 0 = broke it), y = swing-high RSI,
   bubble area = 24h volume, colour = network bucket (3 series max).
   Click a quadrant or legend item to filter; click a bubble to open its chart. */
function renderScatter(pass) {
  const pts = pass.filter(r => r.pct52 != null && r.swing != null);
  const box = $("scatter"), W = Math.max(300, box.clientWidth - 32), H = W < 520 ? 320 : 380;
  const m = { l: 42, r: 14, t: 14, b: 38 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  if (!pts.length) { box.innerHTML = `<div class="none" style="padding:60px 0;text-align:center">No tokens pass the current filters.</div>`; $("scatterLegend").innerHTML = ""; return; }
  const xs = pts.map(p => p.pct52), ys = pts.map(p => p.swing);
  let x0 = Math.floor(Math.min(-S.f.near, ...xs) / 5) * 5, x1 = Math.ceil(Math.max(5, ...xs) / 5) * 5;
  let y0 = Math.floor((Math.min(S.f.swing, ...ys) - 2) / 5) * 5, y1 = Math.min(100, Math.ceil((Math.max(QUAD_RSI + 5, ...ys) + 2) / 5) * 5);
  const sx = v => m.l + (v - x0) / (x1 - x0 || 1) * pw, sy = v => m.t + ph - (v - y0) / (y1 - y0 || 1) * ph;
  const maxVol = Math.max(1, ...pts.map(p => p.vol24 ?? 0));
  const rad = p => 4 + 16 * Math.sqrt((p.vol24 ?? 0) / maxVol);   // area ∝ volume
  const qx = sx(Math.min(Math.max(0, x0), x1)), qy = sy(Math.min(Math.max(QUAD_RSI, y0), y1));
  const compact = W < 560;
  let svg = `<svg width="100%" viewBox="0 0 ${W} ${H}" role="img" aria-label="Quadrant chart of swing-high RSI versus percent from 52-week high, bubble size is 24h volume">`;
  // clickable quadrant regions (behind everything)
  const qrect = { TL: [m.l, m.t, qx - m.l, qy - m.t], TR: [qx, m.t, m.l + pw - qx, qy - m.t],
                  BL: [m.l, qy, qx - m.l, m.t + ph - qy], BR: [qx, qy, m.l + pw - qx, m.t + ph - qy] };
  for (const [k, [x, y, w, h]] of Object.entries(qrect)) {
    if (w <= 0 || h <= 0) continue;
    const on = S.sel.quad === k;
    const fill = on ? "var(--accent)" : k === "TR" ? "var(--good)" : "transparent";
    svg += `<rect class="quad" data-q="${k}" x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" opacity="${on ? 0.1 : k === "TR" ? 0.06 : 1}" role="button" aria-pressed="${on}" aria-label="Filter quadrant ${QUADS[k]}"/>`;
  }
  const ql = (k, x, y, a, t2) => {
    const on = S.sel.quad === k;
    return `<text x="${x}" y="${y}" text-anchor="${a}" style="font-weight:${on ? 700 : 600};fill:var(${on ? "--text-primary" : "--text-secondary"});pointer-events:none">${QUADS[k]}</text>` +
      (compact ? "" : `<text x="${x}" y="${y + 13}" text-anchor="${a}" style="pointer-events:none">${t2}</text>`);
  };
  const bottom = m.t + ph - (compact ? 6 : 20);
  const xStep = (x1 - x0) > 60 ? 20 : (x1 - x0) > 30 ? 10 : 5;
  for (let v = Math.ceil(x0 / xStep) * xStep; v <= x1; v += xStep) {
    svg += `<line x1="${sx(v)}" x2="${sx(v)}" y1="${m.t}" y2="${m.t + ph}" stroke="var(--grid)" style="pointer-events:none"/>`;
    svg += `<text x="${sx(v)}" y="${H - 22}" text-anchor="middle">${v > 0 ? "+" : ""}${v}%</text>`;
  }
  for (let v = Math.ceil(y0 / 5) * 5; v <= y1; v += 5) {
    svg += `<line x1="${m.l}" x2="${m.l + pw}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--grid)" style="pointer-events:none"/>`;
    svg += `<text x="${m.l - 6}" y="${sy(v) + 4}" text-anchor="end">${v}</text>`;
  }
  svg += ql("TR", m.l + pw - 6, m.t + 14, "end", "broke 52WH, RSI ≥ " + QUAD_RSI);
  svg += ql("TL", m.l + 6, m.t + 14, "start", "strong momentum, not broken yet");
  svg += ql("BR", m.l + pw - 6, bottom, "end", "broke 52WH, RSI < " + QUAD_RSI);
  svg += ql("BL", m.l + 6, bottom, "start", "below high, moderate momentum");
  svg += `<line x1="${qx}" x2="${qx}" y1="${m.t}" y2="${m.t + ph}" stroke="var(--text-muted)" stroke-dasharray="4 3" style="pointer-events:none"/>`;
  svg += `<line x1="${m.l}" x2="${m.l + pw}" y1="${qy}" y2="${qy}" stroke="var(--text-muted)" stroke-dasharray="4 3" style="pointer-events:none"/>`;
  svg += `<text x="${m.l + pw / 2}" y="${H - 4}" text-anchor="middle">% from 52-week high  →  broke it</text>`;
  svg += `<text transform="translate(11 ${m.t + ph / 2}) rotate(-90)" text-anchor="middle">RSI last touch (swing high)</text>`;
  const active = p => matchSel(p);   // all selections apply; non-matching bubbles fade
  const order = [...pts].sort((a, b) => (active(a) - active(b)) || ((b.vol24 ?? 0) - (a.vol24 ?? 0)));   // faded first, then big→small
  order.forEach(p => {
    const on = active(p);
    svg += `<circle class="dot" data-inst="${esc(p.inst)}" cx="${sx(p.pct52)}" cy="${sy(p.swing)}" r="${rad(p)}" fill="${NET_COLOR[p.net]}"
      fill-opacity="${on ? 0.8 : 0.12}" stroke="var(--surface-1)" stroke-width="2" style="cursor:pointer"/>`;
  });
  // direct labels: selected token + the 6 highest-volume active tokens
  const labelled = [...pts].filter(active).sort((a, b) => (b.vol24 ?? 0) - (a.vol24 ?? 0)).slice(0, 6);
  labelled.forEach(p => {
    const x = sx(p.pct52), r = rad(p), right = x > m.l + pw - 60;
    svg += `<text class="lbl" x="${right ? x - r - 4 : x + r + 4}" y="${sy(p.swing) + 4}" text-anchor="${right ? "end" : "start"}" style="pointer-events:none;font-weight:600">${esc(p.base)}</text>`;
  });
  svg += "</svg>";
  box.innerHTML = svg;
  const byInst = Object.fromEntries(pts.map(p => [p.inst, p]));
  box.querySelectorAll(".dot").forEach(el => {
    const p = byInst[el.dataset.inst], r0 = +el.getAttribute("r"), op = el.getAttribute("fill-opacity");
    el.addEventListener("mousemove", e => { el.setAttribute("r", r0 + 2); el.setAttribute("fill-opacity", "1"); showTip(e, tipHtml(p) + `<div style="margin-top:4px;color:var(--text-muted)">Click to open on TradingView</div>`); });
    el.addEventListener("mouseleave", () => { el.setAttribute("r", r0); el.setAttribute("fill-opacity", op); hideTip(); });
    el.addEventListener("click", e => { e.stopPropagation(); hideTip(); window.open(tvUrl(p.base), "_blank", "noopener"); });
  });
  box.querySelectorAll(".quad").forEach(el => {
    el.addEventListener("mousemove", e => {
      const k = el.dataset.q, n = pts.filter(p => quadOf(p) === k && matchSel(p, "quad")).length;
      showTip(e, `<b>${QUADS[k]}</b><div class="row"><span>Tokens</span><span>${n}</span></div><div style="margin-top:4px;color:var(--text-muted)">${S.sel.quad === k ? "Click to clear filter" : "Click to filter"}</div>`);
    });
    el.addEventListener("mouseleave", hideTip);
    el.addEventListener("click", () => { hideTip(); toggleSel("quad", el.dataset.q); });
  });
  const counts = Object.fromEntries(NET_ORDER.map(n => [n, pts.filter(p => p.net === n && matchSel(p, "net")).length]));
  $("scatterLegend").innerHTML = NET_ORDER.map(n => {
    const on = S.sel.net === n, dim = S.sel.net && !on;
    return `<button type="button" data-net="${n}" class="${on ? "on" : dim ? "dim" : ""}" aria-pressed="${on}" title="${on ? "Clear filter" : "Filter by " + n}"><i style="background:${NET_COLOR[n]}"></i>${n} (${counts[n]})</button>`;
  }).join("") + `<span style="margin-left:auto;color:var(--text-muted);align-self:center">Bubble size = 24h volume</span>`;
  $("scatterLegend").querySelectorAll("button").forEach(b => b.addEventListener("click", () => toggleSel("net", b.dataset.net)));
}
function tipHtml(p) {
  const tf = S.tfs.filter(t => p.above[t] != null).map(t => `${TF_LABEL[t]} ${p.above[t] ? "✓" : "✗"}`).join(" ");
  return `<b>${esc(p.base)}</b> <span style="color:var(--text-muted)">· ${esc(p.net)}</span>
    <div class="row"><span>Close</span><span>${fmtPrice(p.close)}</span></div>
    <div class="row"><span>% from 52WH</span><span>${fmtPct(p.pct52)}</span></div>
    <div class="row"><span>RSI last touch</span><span>${fmtRsi(p.swing)}</span></div>
    <div class="row"><span>RSI D1</span><span>${fmtRsi(p.rsi)}</span></div>
    <div class="row"><span>Vol 24h</span><span>${fmtVol(p.vol24)}</span></div>
    ${tf ? `<div class="row"><span>MA100</span><span>${tf}</span></div>` : ""}`;
}

/* ---------- tooltip ---------- */
function showTip(e, html) {
  const t = $("tip"); t.innerHTML = html; t.style.display = "block";
  const pad = 14, r = t.getBoundingClientRect();
  let x = e.clientX + pad, y = e.clientY + pad;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - pad;
  t.style.left = x + "px"; t.style.top = y + "px";
}
function hideTip() { $("tip").style.display = "none"; }

/* ---------- render: watchlist (Discord layout) ---------- */
function tfBadges(r) {
  return `<span class="tf">${S.tfs.map(tf => `<span class="${r.above[tf] ? "on" : r.above[tf] === false ? "off" : ""}" title="Above MA100 on ${TF_LABEL[tf]}: ${r.above[tf] ? "yes" : r.above[tf] === false ? "no" : "not checked"}">${TF_LABEL[tf]}</span>`).join("")}</span>`;
}
function renderWatch(pass) {
  const q = S.search;
  const list = pass.filter(r => !q || r.base.toLowerCase().includes(q));
  let html = "";
  for (const g of GROUPS) {
    const rows = list.filter(r => tierOf(r) === g.key);
    html += `<div class="group"><div class="group-title">${g.emoji} ${esc(g.label)} <span class="n">(${rows.length})</span><span class="desc">${esc(g.desc)}</span></div>`;
    if (!rows.length) { html += `<div class="none">(none)</div></div>`; continue; }
    for (const n of NET_ORDER) {
      const nr = rows.filter(r => r.net === n)
        .sort((a, b) => ((pctFor(b, g.pct) ?? -1e9) - (pctFor(a, g.pct) ?? -1e9)) || ((b.swing ?? 0) - (a.swing ?? 0)));
      if (!nr.length) continue;
      html += `<div class="net"><div class="net-title"><i style="background:${NET_COLOR[n]}"></i>${n}</div><div class="tbl-wrap"><table>
        <thead><tr><th>Token</th><th class="num">RSI last touch</th><th class="num">Volume (24h)</th><th class="num">% to ${esc(g.short)} high</th></tr></thead><tbody>`;
      for (const r of nr) {
        const p = pctFor(r, g.pct);
        html += `<tr><td><a class="coin" href="${tvUrl(r.base)}" target="_blank" rel="noopener" title="Open ${esc(r.base)} on TradingView">${esc(r.base)}<span class="ext" aria-hidden="true">↗</span></a>${r.partial52 ? `<span class="flag" title="Less than 52 weeks of history">new</span>` : ""}${planBtn(r.base)}</td>
          <td class="num">${fmtRsi(r.swing)}</td><td class="num">${fmtVol(r.vol24)}</td>
          <td class="num ${p >= 0 ? "pos" : "neg"}">${fmtPct(p)}</td></tr>`;
      }
      html += `</tbody></table></div></div>`;
    }
    html += `</div>`;
  }
  $("panelWatch").innerHTML = html;
}

/* ---------- render: all instruments (sortable table) ---------- */
function nearestHigh(r) {   // % to the high that matters for this token's tier
  const t = tierOf(r), g = GROUPS.find(x => x.key === t);
  return { pct: pctFor(r, g.pct), label: g.short };
}
const ALL_COLS = [
  { key: "base", label: "Token", get: r => r.base, fmt: r => `<a class="coin" href="${tvUrl(r.base)}" target="_blank" rel="noopener" title="Open ${esc(r.base)} on TradingView">${esc(r.base)}<span class="ext" aria-hidden="true">↗</span></a>` },
  { key: "swing", label: "RSI last touch", num: true, get: r => r.swing, fmt: r => fmtRsi(r.swing) },
  { key: "vol24", label: "Volume (24h)", num: true, get: r => r.vol24, fmt: r => fmtVol(r.vol24) },
  { key: "pctHigh", label: "% to high", num: true, get: r => nearestHigh(r).pct,
    fmt: r => { const h = nearestHigh(r); return `<span class="${h.pct >= 0 ? "pos" : ""}">${fmtPct(h.pct)}</span> <span class="flag">${h.label}</span>`; } },
  { key: "tier", label: "Tier", get: r => GROUPS.findIndex(g => g.key === tierOf(r)), fmt: r => { const g = GROUPS.find(x => x.key === tierOf(r)); return `<span style="color:var(--text-secondary)">${g.emoji} ${esc(g.label)}</span>`; } },
  { key: "plan", label: "Planner", get: r => (plHas(r.base) ? 1 : 0), fmt: r => planBtn(r.base).replace('class="addp', 'style="margin-left:0" class="addp') },
  { key: "pass", label: "On watchlist", get: r => (screen(r) ? 1 : 0), fmt: r => screen(r) ? `<span class="pass">✓ Yes</span>` : `<span class="fail">–</span>` },
];
function renderAll() {
  const q = S.search;
  const col = ALL_COLS.find(c => c.key === S.sort.key) || ALL_COLS[2];
  const rows = S.rows.filter(r => (!q || r.base.toLowerCase().includes(q)) && matchSel(r))
    .sort((a, b) => {
      const va = col.get(a), vb = col.get(b);
      if (va == null && vb == null) return 0; if (va == null) return 1; if (vb == null) return -1;
      return (typeof va === "string" ? va.localeCompare(vb) : va - vb) * S.sort.dir;
    });
  let html = `<table><thead><tr>${ALL_COLS.map(c =>
    `<th class="${c.num ? "num" : ""} ${c.nosort ? "" : "sortable"}" data-key="${c.key}">${c.label}${S.sort.key === c.key ? `<span class="arrow">${S.sort.dir > 0 ? "▲" : "▼"}</span>` : ""}</th>`
  ).join("")}</tr></thead><tbody>`;
  for (const r of rows) html += `<tr>${ALL_COLS.map(c => `<td class="${c.num ? "num" : ""}">${c.fmt(r)}</td>`).join("")}</tr>`;
  html += `</tbody></table>`;
  $("panelAll").innerHTML = html;
  $("panelAll").querySelectorAll("th.sortable").forEach(th => th.addEventListener("click", () => {
    const k = th.dataset.key;
    S.sort = { key: k, dir: S.sort.key === k ? -S.sort.dir : (["base", "tier"].includes(k) ? 1 : -1) };
    renderAll();
  }));
}

/* ---------- planner (saved in this browser; export/import for backup) ---------- */
const PL_KEY = "scr-planner-v1";
const STAGES = [
  { key: "watch",  label: "Watching",       color: "var(--text-muted)" },
  { key: "setup",  label: "Setup forming",  color: "#eda100" },
  { key: "plan",   label: "Entry planned",  color: "var(--accent)" },
  { key: "open",   label: "In trade",       color: "var(--good)" },
  { key: "closed", label: "Closed / review", color: "#9085e9" },
];
const PL = { cards: [] };
function plLoad() { try { const d = JSON.parse(storage(PL_KEY) || "{}"); PL.cards = Array.isArray(d.cards) ? d.cards : []; } catch (e) { PL.cards = []; } }
function plSave() { storage(PL_KEY, JSON.stringify({ v: 1, cards: PL.cards })); }
const plHas = base => PL.cards.some(c => c.base === base && c.status !== "closed");
function plAdd(base, status = "watch") {
  base = String(base || "").trim().toUpperCase().replace(/-?USDT(-SWAP|\.P)?$/, "");
  if (!base) return false;
  if (plHas(base)) return false;
  const now = new Date().toISOString();
  PL.cards.unshift({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), base, status, note: "", entry: "", sl: "", tp: "", created: now, updated: now });
  plSave(); return true;
}
function plCard(id) { return PL.cards.find(c => c.id === id); }
function plTouch(c) { c.updated = new Date().toISOString(); plSave(); }
function rrText(c) {
  const e = parseFloat(c.entry), sl = parseFloat(c.sl), tp = parseFloat(c.tp);
  if (!(e > 0) || !(sl > 0)) return "Set entry & stop for R:R";
  const long = sl < e, risk = Math.abs(e - sl), riskPct = risk / e * 100;
  let s = `${long ? "Long" : "Short"} · risk <b>${riskPct.toFixed(1)}%</b>`;
  if (tp > 0) {
    const reward = long ? tp - e : e - tp;
    s += reward > 0 ? ` · R:R <b>${(reward / risk).toFixed(2)}</b>` : ` · <span style="color:var(--critical-text)">target on wrong side</span>`;
  }
  return s;
}
const ago = iso => { const m = (Date.now() - Date.parse(iso)) / 6e4; return m < 1 ? "just now" : m < 60 ? Math.round(m) + "m ago" : m < 1440 ? Math.round(m / 60) + "h ago" : Math.round(m / 1440) + "d ago"; };
function cardHtml(c) {
  const r = S.rows.find(x => x.base === c.base);
  let meta = `<span style="color:var(--text-muted)">Not in latest scan</span>`;
  if (r) {
    const g = GROUPS.find(x => x.key === tierOf(r)), hi = nearestHigh(r);
    meta = `${g.emoji} ${esc(g.label)} · ${screen(r) ? `<span class="pass">on watchlist</span>` : "off watchlist"}<br>
      % to ${hi.label} high <b>${fmtPct(hi.pct)}</b> · RSI touch <b>${fmtRsi(r.swing)}</b> · Vol <b>${fmtVol(r.vol24)}</b>`;
  }
  const opts = STAGES.map(st => `<option value="${st.key}" ${st.key === c.status ? "selected" : ""}>${st.label}</option>`).join("");
  return `<div class="pc" draggable="true" data-id="${c.id}">
    <div class="pc-top"><a class="coin" href="${tvUrl(c.base)}" target="_blank" rel="noopener" title="Open on TradingView">${esc(c.base)}<span class="ext" aria-hidden="true">↗</span></a>
      <button class="del" type="button" data-act="del" title="Delete card" aria-label="Delete ${esc(c.base)} card">✕</button></div>
    <div class="pc-meta">${meta}</div>
    <div class="pc-lv">
      <label>Entry<input inputmode="decimal" data-f="entry" value="${esc(c.entry)}"></label>
      <label>Stop<input inputmode="decimal" data-f="sl" value="${esc(c.sl)}"></label>
      <label>Target<input inputmode="decimal" data-f="tp" value="${esc(c.tp)}"></label>
    </div>
    <div class="pc-rr">${rrText(c)}</div>
    <textarea data-f="note" placeholder="Notes: setup, reason, invalidation, lessons…">${esc(c.note)}</textarea>
    <div class="pc-foot"><span title="${esc(c.updated)}">Updated ${ago(c.updated)}</span><select data-f="status" aria-label="Move card">${opts}</select></div>
  </div>`;
}
function renderPlanner() {
  $("cPlan").textContent = PL.cards.length || "";
  $("plTokens").innerHTML = S.rows.map(r => `<option value="${esc(r.base)}">`).join("");
  if (S.tab !== "plan") return;
  $("board").innerHTML = STAGES.map(st => {
    const cards = PL.cards.filter(c => c.status === st.key);
    return `<div class="col" data-status="${st.key}"><div class="col-h"><span class="dot" style="background:${st.color}"></span>${st.label}<span class="n">${cards.length}</span></div>
      <div class="col-b">${cards.length ? cards.map(cardHtml).join("") : `<div class="col-empty">${st.key === "watch" ? "Add tokens with the + Plan button in the watchlist, or type one above." : "Drag cards here"}</div>`}</div></div>`;
  }).join("");
}
function plMove(id, status) { const c = plCard(id); if (!c || c.status === status) return; c.status = status; plTouch(c); renderPlanner(); render(); }
(function bindPlanner() {
  const board = $("board");
  // edits: save on input without re-rendering (keeps focus while typing)
  board.addEventListener("input", e => {
    const el = e.target, f = el.dataset.f, card = el.closest(".pc"); if (!f || !card || f === "status") return;
    const c = plCard(card.dataset.id); if (!c) return;
    c[f] = el.value; plTouch(c);
    if (f !== "note") card.querySelector(".pc-rr").innerHTML = rrText(c);
  });
  board.addEventListener("change", e => { if (e.target.dataset.f === "status") plMove(e.target.closest(".pc").dataset.id, e.target.value); });
  board.addEventListener("click", e => {
    const b = e.target.closest("[data-act=del]"); if (!b) return;
    const card = b.closest(".pc"), c = plCard(card.dataset.id);
    if (c && (!c.note && !c.entry) || confirmDelete(card)) { PL.cards = PL.cards.filter(x => x.id !== card.dataset.id); plSave(); renderPlanner(); render(); }
  });
  // drag & drop between columns
  let dragId = null;
  board.addEventListener("dragstart", e => {
    const card = e.target.closest(".pc"); if (!card || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    dragId = card.dataset.id; card.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", dragId);
  });
  board.addEventListener("dragend", e => { const card = e.target.closest(".pc"); if (card) card.classList.remove("dragging"); board.querySelectorAll(".col.drop").forEach(c => c.classList.remove("drop")); });
  board.addEventListener("dragover", e => { const col = e.target.closest(".col"); if (!col || !dragId) return; e.preventDefault(); board.querySelectorAll(".col.drop").forEach(c => c !== col && c.classList.remove("drop")); col.classList.add("drop"); });
  board.addEventListener("drop", e => { const col = e.target.closest(".col"); if (!col || !dragId) return; e.preventDefault(); const id = dragId; dragId = null; plMove(id, col.dataset.status); });
  // add / export / import
  const add = () => { const v = $("plAdd").value; if (plAdd(v)) { $("plAdd").value = ""; renderPlanner(); render(); } else if (v) { $("plAdd").select(); } };
  $("plAddBtn").addEventListener("click", add);
  $("plAdd").addEventListener("keydown", e => { if (e.key === "Enter") add(); });
  $("plExport").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify({ v: 1, exported: new Date().toISOString(), cards: PL.cards }, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `screener-planner-${new Date().toISOString().slice(0, 10)}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  $("plImportBtn").addEventListener("click", () => $("plImport").click());
  $("plImport").addEventListener("change", async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const d = JSON.parse(await f.text()); if (!Array.isArray(d.cards)) throw new Error("no cards");
      const ids = new Set(PL.cards.map(c => c.id));
      d.cards.forEach(c => { if (c && c.id && c.base && !ids.has(c.id)) PL.cards.push({ note: "", entry: "", sl: "", tp: "", status: "watch", ...c }); });
      plSave(); renderPlanner(); render();
    } catch (err) { alertBanner("That file isn't a planner export."); }
    e.target.value = "";
  });
})();
function confirmDelete(card) {   // inline confirm instead of a browser dialog
  if (card.dataset.confirm) return true;
  card.dataset.confirm = "1"; const b = card.querySelector("[data-act=del]");
  b.textContent = "Delete?"; b.style.fontSize = "11px"; b.style.color = "var(--critical-text)";
  setTimeout(() => { if (card.isConnected) { delete card.dataset.confirm; b.textContent = "✕"; b.style.cssText = ""; } }, 3000);
  return false;
}
function alertBanner(msg) { $("banner").innerHTML = `<div class="card banner">${esc(msg)}</div>`; setTimeout(() => $("banner").innerHTML = "", 4000); }
function planBtn(base) {
  return plHas(base) ? `<button class="addp in" type="button" data-plan="${esc(base)}" title="Already in planner — open planner">✓ Planned</button>`
                     : `<button class="addp" type="button" data-plan="${esc(base)}" title="Add ${esc(base)} to planner">+ Plan</button>`;
}
// one delegated handler for every "+ Plan" button (tables re-render often)
document.addEventListener("click", e => {
  const b = e.target.closest(".addp"); if (!b) return;
  const base = b.dataset.plan;
  if (plHas(base)) { document.querySelector('.tab[data-tab="plan"]').click(); return; }
  plAdd(base); b.outerHTML = planBtn(base); renderPlanner();
});

/* ---------- master render ---------- */
function render() {
  if (!S.rows.length) return;
  const pass = S.rows.filter(screen);
  const view = pass.filter(r => matchSel(r));   // watchlist after cross-filter selections
  renderChips(); renderKpis(view); renderBars(pass); renderScatter(pass);
  $("cWatch").textContent = view.length; $("cAll").textContent = S.rows.filter(r => matchSel(r)).length;
  if (S.tab === "watch") renderWatch(view); else if (S.tab === "all") renderAll();
  renderPlanner();
}
addEventListener("keydown", e => {
  if (e.key === "Escape" && !/INPUT|SELECT/.test(document.activeElement.tagName)) clearSel();
});

/* ---------- tabs & search ---------- */
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  S.tab = t.dataset.tab;
  document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", String(x === t)));
  $("panelWatch").hidden = S.tab !== "watch"; $("panelAll").hidden = S.tab !== "all"; $("panelPlan").hidden = S.tab !== "plan";
  render();
}));
$("search").addEventListener("input", e => { S.search = e.target.value.trim().toLowerCase(); render(); });
let rT; addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(render, 150); });

/* ---------- boot ---------- */
async function load() {
  $("refreshed").textContent = "Loading data…"; $("dot").className = "status-dot"; $("banner").innerHTML = "";
  try {
    const raw = await fetchCsv(LATEST_FILE);
    if (!raw.length) throw new Error("The CSV has no rows yet.");
    S.cols = detectColumns(raw[0]); S.tfs = S.cols.tfs;
    S.rows = normalise(raw, S.cols).filter(r => r.inst);
    loadFilters(); syncFilterInputs();
    const ts = S.rows.map(r => Date.parse(r.refreshed)).filter(Number.isFinite);
    const last = ts.length ? new Date(Math.max(...ts)) : null;
    if (last) {
      const ageH = (Date.now() - last) / 36e5;
      S.lastTime = last; S.ageText = ageH < 1 ? Math.round(ageH * 60) + " min ago" : ageH.toFixed(1) + " h ago";
      $("refreshed").textContent = `Data as of ${last.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" })} · ${ageH < 1 ? Math.round(ageH * 60) + " min" : ageH.toFixed(1) + " h"} ago · refreshes every 4 h`;
      $("dot").className = "status-dot" + (ageH > STALE_HOURS ? " stale" : "");
    } else $("refreshed").textContent = "Data loaded";
    $("notes").innerHTML = `
      <b>How to read this.</b> The watchlist uses the same rules as the Discord digest: price above its MA100 demarcation line on ${S.tfs.filter(t => GATE_TFS.includes(t)).map(t => TF_LABEL[t]).join(", ") || "1D"},
      RSI D1 above the minimum, swing-high RSI (highest daily RSI14 in the last ${S.cols.swingDays ?? 22} days) above the minimum,
      ${S.cols.avgDays ?? 14}-day average volume above the liquidity floor, and price within the near-high band of a 3M/6M/52W/ATH level.
      Changing the filters above only changes this page, not the screener itself.<br>
      <b>Interactions.</b> Click a tier bar, a quadrant or a network in the legend to filter every other visual (click again, use the chips, or press Esc to clear).
      Click a bubble or a token name to open it on TradingView.<br>
      <b>Planner.</b> Use <i>+ Plan</i> on any token to add a card, then move it from Watching to Closed as the trade develops. Notes, entry, stop and target are saved in this browser only —
      use <i>Export</i> to back them up or move them to another device, and <i>Import</i> to load them back.<br>
      <b>BOS</b> = break of structure (the 52W/6M/3M high was broken). <b>Approaching</b> = not broken yet, but within the band of that level.
      Network grouping is a best-effort lookup. <b>⚠️ Trade at your own risk</b> — this is a screen, not a signal.`;
    render();
  } catch (e) {
    $("dot").className = "status-dot err";
    $("refreshed").textContent = "Couldn't load data";
    $("banner").innerHTML = `<div class="card banner"><b>Couldn't load the screener data.</b><br>
      <span style="color:var(--text-secondary)">${esc(e.message)}. The screener writes <code>data/${LATEST_FILE}</code> after each run —
      check that at least one run has finished and committed it.</span></div>`;
    $("panelWatch").innerHTML = "";
  }
}
$("reload").addEventListener("click", load);
bindFilters();
plLoad();
load();
</script>

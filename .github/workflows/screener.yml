name: OKX Screener

on:
  schedule:
    # Every 4 hours at :10 -> 8:10 AM, 12:10 PM, 4:10 PM, 8:10 PM, 12:10 AM, 4:10 AM (Manila time).
    # For hourly instead, change to: "10 * * * *"
    - cron: "10 */4 * * *"
  workflow_dispatch:   # adds the manual "Run workflow" button

permissions:
  contents: write      # lets the run save the CSVs back into the repo

concurrency:
  group: okx-screener
  cancel-in-progress: false

jobs:
  screener:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # deep-history scan of ~485 pairs can take 10-20 min under OKX's rate limit
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Run screener
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_SCREENER }}
          DISCORD_MENTION: ${{ vars.DISCORD_MENTION }}
        run: python okx_screener.py --output-dir data

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "data: screener refresh $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
